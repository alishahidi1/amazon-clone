name: Ask Copilot on PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ask-copilot:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ask-copilot:')
    runs-on: ubuntu-latest

    steps:
      - name: Parse question
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body || '';
            const match = body.match(/^\/ask-copilot:\s*(.*)$/s);

            if (!match) {
              core.setFailed('No question found after /ask-copilot:');
              return;
            }

            const question = match[1].trim();
            if (!question) {
              core.setFailed('Question is empty.');
              return;
            }

            core.setOutput('question', question);

      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y gh
          }

      - name: Authenticate gh
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token

      - name: Install Copilot CLI extension
        run: |
          gh extension install github/gh-copilot || true

      - name: Ask Copilot and post reply
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          QUESTION="${{ steps.parse.outputs.question }}"
          echo "Question: $QUESTION"

          ANSWER="$(gh copilot suggest --prompt "$QUESTION" 2>/tmp/copilot.err || cat /tmp/copilot.err || true)"

          if [ -z "$ANSWER" ] || [ "$ANSWER" = "null" ]; then
            echo "Copilot CLI did not return a usable answer."
            exit 1
          fi

          gh api \
            -X POST \
            repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -f body="@${{ github.actor }}

$ANSWER"
