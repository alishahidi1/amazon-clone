name: Ask Copilot on PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ask-copilot:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ask-copilot:')
    runs-on: ubuntu-latest

    steps:
      - name: Parse question
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body || '';
            const match = body.match(/^\/ask-copilot:\s*(.*)$/s);

            if (!match) {
              core.setFailed('No question found after /ask-copilot:');
              return;
            }

            const question = match[1].trim();
            if (!question) {
              core.setFailed('Question is empty.');
              return;
            }

            core.setOutput('question', question);

      - name: Ask the model and reply on the PR
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const question = `${{ steps.parse.outputs.question }}`;

            if (!process.env.OPENAI_API_KEY) {
              throw new Error('Missing OPENAI_API_KEY secret.');
            }

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [
                  {
                    role: 'system',
                    content: 'You are a helpful coding assistant replying inside a GitHub PR. Keep the answer concise, actionable, and technical.'
                  },
                  {
                    role: 'user',
                    content: question
                  }
                ]
              })
            });

            if (!response.ok) {
              const text = await response.text();
              throw new Error(`Model API failed: ${text}`);
            }

            const data = await response.json();
            const answer = data.choices?.[0]?.message?.content?.trim();

            if (!answer) {
              throw new Error('No answer returned from model.');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${context.actor}\n\n${answer}`
            });
