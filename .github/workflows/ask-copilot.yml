name: Ask Copilot on PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ask-copilot:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ask-copilot:')
    runs-on: ubuntu-latest

    steps:
      - name: Parse question
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body || ''
            const match = body.match(/^\/ask-copilot:\s*(.*)$/s)

            if (!match) {
              core.setFailed('No question found after /ask-copilot:')
              return
            }

            const question = match[1].trim()
            if (!question) {
              core.setFailed('Question is empty.')
              return
            }

            core.setOutput('question', question)

      - name: Install GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Verify Copilot extension
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          gh extension install github/gh-copilot || true
          gh extension list
          gh copilot --help || true

      - name: Ask Copilot and save answer
        id: answer
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        shell: bash
        run: |
          QUESTION='${{ steps.parse.outputs.question }}'
          ANSWER="$(gh copilot -p "$QUESTION" 2>/tmp/copilot.err || cat /tmp/copilot.err || true)"
          if [ -z "$ANSWER" ] || [ "$ANSWER" = "null" ]; then
            echo "Copilot CLI did not return a usable answer."
            exit 1
          fi
          printf '%s' "$ANSWER" > /tmp/copilot-answer.txt

      - name: Post answer as PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const answer = fs.readFileSync('/tmp/copilot-answer.txt', 'utf8').trim()
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${context.actor}\n\n${answer}`
            })
